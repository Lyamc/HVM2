[package]
name = "hvm"
description = "A massively parallel, optimal functional runtime in Rust."
license = "Apache-2.0"
version = "2.0.22"
edition = "2021"
rust-version = "1.74"
build = "build.rs"
repository = "https://github.com/Lyamc/HVM2"

[lib]
name = "hvm"
path = "src/lib.rs"

[dependencies]
TSPL = "0.0.13"
clap = "4.5.2"
highlight_error = "0.1.1"
num_cpus = "1.0"
bytemuck = { version = "1", optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "30", optional = true }

[build-dependencies]
cc = "1.0"
num_cpus = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = []
# Enabled automatically by build.rs when the matching compiler is found.
# Set HVM_SKIP_C / HVM_SKIP_CUDA to force the Rust-only build.
c = []
cuda = []
# Optional WebGPU interpreter. Not auto-detected. Same .hvm books as `run`.
#   cargo build --release --features wgpu
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
insta = { version = "1.39.0", features = ["glob"] }

# rust-lld (default Linux rustc linker) rejects gcc's -rdynamic.
# This is the rustc-native equivalent so IO plugins can see host symbols.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "export-executable-symbols"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "export-executable-symbols"]
